# Compiles what the Linux development machine cannot, and renders the screens for review.
#
# Hardset is developed on Linux, which can parse Swift and run the Core and Store suites but cannot
# compile SwiftUI, Charts, WidgetKit or AlarmKit. This job builds the package for the macOS host,
# builds the app and widget for the iOS Simulator, and runs HardsetUISnapshotTests, which writes a
# PNG of every screen. The images and full logs are uploaded as the `hardset-ios-ui` artifact.

name: iOS build and screens

on:
  push:
    # main too: Core and Store changes land there from other worktrees, and one already broke the
    # UI's compile without anything on Linux noticing.
    branches: ["main", "FrankieBiz/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build app and render screens
    runs-on: macos-26
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone 17" || true

      - name: Build HardsetKit for the macOS host
        run: |
          set -o pipefail
          swift build --package-path Packages/HardsetKit 2>&1 | tee macos-build.log | tail -40

      - name: Test portability, receipt, Health storage and retry guarantees
        run: |
          set -o pipefail
          swift test --package-path Packages/HardsetKit \
            --filter 'CSVDocumentTests|SetCommandTests|DataTransferTests|RestJournalTests|ReceiptStoreTests|DeviceHealthStoreTests|MachineIncrementTests|ProgressionStoreTests' \
            2>&1 | tee portable-feature-tests.log | tail -50

      # The snapshot target only compiles for the iOS Simulator, and the render step further down is
      # where it first did, about twenty minutes into a run. Building the package's tests here makes
      # a test-target compile error fail within minutes of the host build instead.
      - name: Compile the package tests for the iOS Simulator
        run: |
          set -o pipefail
          cd Packages/HardsetKit
          xcodebuild build-for-testing \
            -scheme HardsetKit-Package \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -skipMacroValidation -skipPackagePluginValidation \
            2>&1 | tee ../../snapshot-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" ../../snapshot-build.log

      - name: Build the app and widget for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Hardset.xcodeproj -scheme Hardset \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee app-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" app-build.log

      # The device installer builds Release (an unoptimised Debug build makes every database read
      # slower than it is), so Release has to compile too: it drops every `#if DEBUG` branch.
      - name: Build the app and widget in Release
        run: |
          set -o pipefail
          xcodebuild build \
            -project Hardset.xcodeproj -scheme Hardset -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee app-build-release.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" app-build-release.log

      - name: Test the app target on the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -project Hardset.xcodeproj -scheme Hardset \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:HardsetTests \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee app-test.log | grep -E "error:|TEST (SUCCEEDED|FAILED)|Test run" || true
          grep -q "TEST SUCCEEDED" app-test.log
          grep -Eq 'Test run with [1-9][0-9]* tests? in [1-9][0-9]* suites? passed' app-test.log

      - name: Render screens on the iOS Simulator
        env:
          TEST_RUNNER_HARDSET_SNAPSHOT_DIR: ${{ github.workspace }}/snapshots
        run: |
          set -o pipefail
          mkdir -p snapshots
          cd Packages/HardsetKit
          xcodebuild test \
            -scheme HardsetKit-Package \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:HardsetUISnapshotTests \
            -parallel-testing-enabled NO \
            -skipMacroValidation -skipPackagePluginValidation \
            2>&1 | tee ../../snapshot-test.log | grep -E "error:|TEST (SUCCEEDED|FAILED)|Test run" || true
          ls -la ../../snapshots
          grep -q "TEST SUCCEEDED" ../../snapshot-test.log

      # The real app, launched and driven by HardsetUITests: system-composited screenshots (glass
      # included) and Apple's accessibility audit of each screen. Signed to run locally rather than
      # unsigned, so the app's entitlements stay embedded exactly as on a device. The app now
      # carries no iCloud container (a personal team cannot sign one), so this journey is also the
      # regression check that such a build opens local-only instead of failing at startup.
      - name: Drive the real app on the iOS Simulator
        env:
          TEST_RUNNER_HARDSET_UI_SHOT_DIR: ${{ github.workspace }}/app-screens
        run: |
          set -o pipefail
          mkdir -p app-screens
          # One known device, booted here, so its log can be streamed for the whole run: when the
          # app exits under test without a crash report, its own log is the only explanation.
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS-26" in r), key=lambda r: [int(x) for x in r.split("iOS-")[1].split("-")])
          for runtime in reversed(runtimes):
              for d in devices[runtime]:
                  if d["name"] == "iPhone 17":
                      print(d["udid"]); sys.exit()
          ')
          echo "Device: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" log stream --level debug --style compact \
            --predicate 'process == "Hardset" OR eventMessage CONTAINS[c] "hardset"' \
            > app-screens/app-log.txt 2>&1 &
          LOG_PID=$!
          COMMON="-project Hardset.xcodeproj -scheme Hardset -destination id=$UDID -derivedDataPath dd \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="
          xcodebuild build-for-testing $COMMON 2>&1 | tee ui-build.log | grep -E "error:|BUILD|TEST BUILD" || true
          APP_BUNDLE=$(find dd/Build/Products -name Hardset.app -type d | head -n 1)
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_BUNDLE/Info.plist" 2>/dev/null || true)
          RUNNER_APP=$(find dd/Build/Products -name '*-Runner.app' -type d | head -n 1)
          RUNNER_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$RUNNER_APP/Info.plist" 2>/dev/null || true)
          # The simulator can refuse to launch the UI test runner while it is still installing or
          # removing the runner bundle:
          #   Simulator device failed to launch com.francisbisignano.hardset.uitests.xctrunner.
          #   Application "...xctrunner" is installing or uninstalling, and cannot be launched. (Busy)
          # Nothing is wrong with the app or the tests when it does, and it has cost whole runs on
          # pull requests and on main. xcodebuild installs and launches the runner inside one
          # process, so this script cannot wait between the two. ui_xcodebuild (Tools/ui_launch.sh)
          # waits for the device to stop changing before every invocation, including each launch of
          # the reverse-order loop below, and when that exact denial comes back before any test has
          # run it waits and launches the same invocation again, three attempts in all, printing one
          # line per retry. A run in which a test started is never retried by it, so a real failure
          # stays one. Do not delete the wait or the retry as noise; the Busy denial returns without
          # them.
          . Tools/ui_launch.sh
          export UI_SIM_UDID="$UDID" UI_SIM_BUNDLES="$BUNDLE_ID $RUNNER_ID"
          # A launch can be denied with "Busy" while the simulator is still finishing the app's
          # install (run 44648846716: the first test of the dark pass, the same tree passed in
          # 44618696304). No test is run a second time here. -retry-tests-on-failure was passed to
          # cover that, and it also reran a test that had failed its assertions and let the job go
          # green when the rerun passed (runs 44969910828 and 44973199974), so it is gone. A refusal
          # to launch the runner is retried by ui_xcodebuild above; a refusal of the app inside a
          # test fails that test, and the job, with the denial in the log.
          # Appearance is set on the device itself, around two passes: XCUIDevice.appearance did not
          # reach the system on this runner.
          xcrun simctl ui "$UDID" appearance dark
          ui_xcodebuild "dark pass" ui-test.log test-without-building $COMMON \
            -only-testing:HardsetUITests \
            -skip-testing:HardsetUITests/AppScreensUITests/testScreensInLightMode \
            -resultBundlePath app-screens/ui-dark.xcresult || true
          xcrun simctl ui "$UDID" appearance light
          ui_xcodebuild "light pass" ui-test-light.log test-without-building $COMMON \
            -only-testing:HardsetUITests/AppScreensUITests/testScreensInLightMode \
            -resultBundlePath app-screens/ui-light.xcresult || true
          # The same journeys once more, one launch each, in reverse of their normal order. Every
          # journey starts from an empty store (HARDSET_STORE=reset), so the order must not change what
          # any of them finds; a journey that leaned on another's leftovers fails here and not in the
          # passes above, which run in name order. Each test sets the appearance its name says, and its
          # screenshots go to their own directory so they do not overwrite the ones above.
          mkdir -p app-screens-reverse
          REVERSE_FAILED=0
          for TEST in $(grep -oE 'func test[A-Za-z0-9_]+' HardsetUITests/AppScreensUITests.swift | sed 's/^func //' | sort -r); do
            case "$TEST" in
              *Light*) xcrun simctl ui "$UDID" appearance light ;;
              *) xcrun simctl ui "$UDID" appearance dark ;;
            esac
            TEST_RUNNER_HARDSET_UI_SHOT_DIR="$GITHUB_WORKSPACE/app-screens-reverse" \
              ui_xcodebuild "$TEST" "app-screens-reverse/$TEST.log" test-without-building $COMMON \
              -only-testing:HardsetUITests/AppScreensUITests/$TEST \
              -resultBundlePath "app-screens-reverse/$TEST.xcresult" || true
            grep -qE "TEST (EXECUTE )?SUCCEEDED" "app-screens-reverse/$TEST.log" || { echo "Reverse order: $TEST failed"; REVERSE_FAILED=1; }
          done
          kill "$LOG_PID" || true
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data 2>/dev/null || true)
          [ -n "$DATA" ] && cp "$DATA/tmp/stderr.log" app-screens/app-stderr.txt 2>/dev/null || true
          cp -R "$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data/Library/Logs/CrashReporter" app-screens/simulator-crashes 2>/dev/null || true
          ls -la app-screens
          # Each pass is judged on its own. These were one `a && b` line before the reverse-order
          # result was added after them, and under `bash -e` a failed first grep of an `&&` list does
          # not stop the step, so a dark pass that never succeeded (a launch denied on every attempt
          # included) failed nothing while the reverse pass was green.
          PASSES_FAILED=0
          grep -qE "TEST (EXECUTE )?SUCCEEDED" ui-test.log || { echo "Dark pass failed"; PASSES_FAILED=1; }
          grep -qE "TEST (EXECUTE )?SUCCEEDED" ui-test-light.log || { echo "Light pass failed"; PASSES_FAILED=1; }
          [ "$PASSES_FAILED" = 0 ] && [ "$REVERSE_FAILED" = 0 ]

      # When the app dies under test, its crash report is the only explanation. Simulator crashes
      # land in the host's DiagnosticReports.
      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p app-screens/crashes
          find "$HOME/Library/Logs/DiagnosticReports" -name 'Hardset*' -exec cp {} app-screens/crashes/ \; 2>/dev/null || true
          ls -la app-screens/crashes

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: hardset-ios-ui
          path: |
            snapshots/
            app-screens/
            app-screens-reverse/
            *.log
          if-no-files-found: warn
          retention-days: 14
